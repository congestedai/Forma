name: Report a problem
description: Include the release version and reproduction steps.
body:
  - type: input
    id: version
    attributes:
      label: Alien Forma version
      placeholder: Copy the release tag you are using
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and distribution
      placeholder: Windows 11, portable x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and actual result
      description: Use a small reproduction; do not attach private data.
    validations:
      required: true
